[package]
name = "scribe"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
fastembed = "7.1.2"
hf-hub = "1.0.0"
indicatif = "0.18.6"
hound = "3.5.1"
tokio = { version = "1.54.0", features = ["full"] }
whisper-rs = "0.16.0"
laya = "0.1.1"

# GPU backend follows the target OS: CUDA on Linux, Metal on macOS.
[target.'cfg(target_os = "linux")'.dependencies]
whisper-rs = { version = "0.16.0", features = ["cuda"] }
laya = { version = "0.1.1", features = ["cuda"] }

[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.16.0", features = ["metal"] }
laya = { version = "0.1.1", features = ["metal"] }
