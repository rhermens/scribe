[package]
name = "scribe"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
fastembed = "7.1.2"
hound = "3.5.1"
whisper-rs = "0.16.0"

# GPU backend follows the target OS: CUDA on Linux, Metal on macOS.
[target.'cfg(target_os = "linux")'.dependencies]
whisper-rs = { version = "0.16.0", features = ["cuda"] }

[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.16.0", features = ["metal"] }
