[package]
name = "scribe"
version = "0.1.0"
edition = "2024"

[features]
default = []
cuda = ["whisper-rs/cuda", "laya/cuda", "fastembed/cuda"]
metal = ["whisper-rs/metal", "laya/metal", "fastembed/metal"]

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
fastembed = "7.1.2"
hf-hub = "1.0.0"
indicatif = "0.18.6"
hound = "3.5.1"
tokio = { version = "1.54.0", features = ["full"] }
whisper-rs = "0.16.0"
laya = "0.1.1"
serde_json = "1.0.154"
